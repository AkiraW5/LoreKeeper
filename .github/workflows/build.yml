name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Verificação rápida em pushes/PRs: garante que renderer + processo principal compilam.
  verify:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build (renderer + main + preload)
        run: npx vite build

  # Release em tags v*: empacota instalador NSIS + portable e publica no GitHub Releases.
  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer + main + preload
        run: npx vite build

      - name: Package Windows app
        # --publish never: o electron-builder NÃO publica; quem publica é o passo abaixo.
        run: npx electron-builder --win --publish never

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lorekeeper-windows
          path: release/*.exe
          if-no-files-found: error

      - name: Extract release notes from CHANGELOG
        # Pega a seção "## [X.Y.Z]" da tag; falha se ela não existir para não sair release sem descrição.
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="[$v]" '/^## /{p = index($0, v) > 0; next} p' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "::error::CHANGELOG.md não tem a seção [$v]"; exit 1; }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          # latest.yml + .blockmap são o que o electron-updater do app instalado consulta.
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          generate_release_notes: true
